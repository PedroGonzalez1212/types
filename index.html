<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="google" content="notranslate">
<title>Types — In development</title>
<link rel="icon" type="image/png" href="assets/favicon-types.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--surface-page);color:var(--ink);font-family:var(--font-text,"Montserrat",sans-serif);display:flex;align-items:center;justify-content:center;padding:24px}
  .gate{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:32px;text-align:center}
  .gate img{height:40px;width:auto}
  .gate h1{margin:0;font-family:var(--font-display,"Montserrat",sans-serif);font-weight:500;font-size:clamp(24px,4vw,32px);line-height:1.2;letter-spacing:-0.02em}
  .gate p{margin:0;font-size:15px;line-height:1.5;color:var(--ink-muted)}
  .tag{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--brand-teal)}
  .tag::before{content:"";width:7px;height:7px;background:var(--brand-teal);clip-path:polygon(0 0,100% 50%,0 100%)}
  form{width:100%;display:flex;flex-direction:column;gap:14px}
  input[type="password"]{width:100%;padding:14px 16px;background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:2px;color:var(--ink);font-family:inherit;font-size:15px;outline:none;transition:border-color .15s}
  input[type="password"]:focus{border-color:var(--brand-teal)}
  button{width:100%;padding:14px 16px;background:var(--brand-teal);border:1px solid var(--brand-teal);border-radius:2px;color:#fff;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:opacity .15s}
  button:hover{opacity:.9}
  .err{min-height:18px;font-size:13px;color:var(--brand-orange)}
</style>
</head>
<body>
  <div class="gate">
    <img src="assets/types.svg" alt="Types">
    <span class="tag">In development</span>
    <h1>We're building something.</h1>
    <p>This site is in progress and not yet public. Enter the access code shared with you to preview it.</p>
    <form id="gate-form">
      <input type="password" id="gate-pw" placeholder="Access code" autocomplete="off" autofocus>
      <button type="submit">Enter</button>
      <div class="err" id="gate-err"></div>
    </form>
  </div>
  <script>
    var PASSWORD = "types2025";

    var form = document.getElementById('gate-form');
    var input = document.getElementById('gate-pw');
    var err = document.getElementById('gate-err');

    if (sessionStorage.getItem('types-access') === '1') {
      window.location.replace('preview.html');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (input.value === PASSWORD) {
        sessionStorage.setItem('types-access', '1');
        window.location.href = 'preview.html';
      } else {
        err.textContent = 'Incorrect code. Try again.';
        input.value = '';
        input.focus();
      }
    });
  </script>
</body>
</html>
